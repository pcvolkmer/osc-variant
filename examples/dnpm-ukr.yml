forms:
  - name: 'DNPM UF ConsentMV Verlauf'
    form_fields:
      - name: version
        default_value: "Version 02"
  - name: 'DNPM Klinik/Anamnese'
    form_fields:
      - name: Leitlinienstatus
        default_value: "unknown"
      - name: LeitlinienTherapieProgr
        default_value: "9"
      - name: LeitlinienTherapieDurchl
        default_value: "k"
    form_references:
      - name: MTB
        referenced_data_form: 'UKR.Tumorkonferenz'
  - name: 'DNPM UF Therapielinie'
    form_fields:
      - name: Ergebnis
        default_value: "X"
      - name: Beendigung
        default_value: "U"
      - name: Abbruchsgrund
        default_value: "u"
  - name: 'DNPM Therapieplan'
    form_fields:
      - name: statusbegruendung
        default_value: ""
    form_references:
      - name: referstemtb
        referenced_data_form: 'UKR.Tumorkonferenz'
        anzeige_auswahl: '{TK.shortdesc} vom {Datum}'
      - name: reftkhumangenber
        referenced_data_form: 'UKR.Tumorkonferenz'
        anzeige_auswahl: '{TK.shortdesc} vom {Datum}'
      - name: reftkreevaluation
        referenced_data_form: 'UKR.Tumorkonferenz'
        anzeige_auswahl: '{TK.shortdesc} vom {Datum}'